# CompanySys — nginx site config (single domain)
#
# The app and the API share one hostname: the React build is served from /, and
# everything under /api and /uploads is proxied to Node on 3001. One domain, one
# certificate, one DNS record — and because the browser calls its own origin,
# CORS never comes into it.
#
# Install:
#   sudo cp /srv/CompanySysAPI/deploy/nginx-companysys.conf /etc/nginx/sites-available/companysys
#   sudo ln -sf /etc/nginx/sites-available/companysys /etc/nginx/sites-enabled/companysys
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Run certbot AFTER this works over plain http — it edits this file to add the
# certificate and the http->https redirect.

server {
    listen 80;
    server_name task.ips.com.my;

    root /srv/CompanySysFrontend/dist;
    index index.html;

    # Attachments are capped at 10MB by multer; nginx defaults to 1MB and would
    # reject the upload before it ever reached Node.
    client_max_body_size 12M;

    # The API. proxy_pass carries no path, so the full /api/... URI is passed
    # through unchanged — that is what Express has its routers mounted on.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # req.protocol must read "https" behind the proxy: the upload endpoint
        # builds file URLs from it, and http:// links break on an https page.
        # Requires TRUST_PROXY=1 in the API's .env.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # Ticket attachments, served by Express from its uploads/ folder.
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed filenames, so they can be cached hard. index.html must NOT be, or a
    # deploy leaves people on the old build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A React app with no router: every other path returns index.html, or a
    # refresh on any page 404s. Listed last so it never shadows /api.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
